name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Build project (Universal)
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package Binary
        run: |
          mkdir -p dist
          cp .build/apple/Products/Release/DockShortcut dist/
          cd dist
          zip -r ../DockShortcut-v${{ github.ref_name }}.zip DockShortcut
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockShortcut-v${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
