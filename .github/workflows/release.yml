name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          swift --version
          xcodebuild -version
          ls /Applications/

      - name: Build project (Universal)
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package Binary
        run: |
          mkdir -p dist
          # Find the built binary - it might be in a different path for universal builds
          find .build -name DockShortcut -type f -perm +111
          cp .build/apple/Products/Release/DockShortcut dist/ || cp .build/release/DockShortcut dist/
          cd dist
          zip -r ../DockShortcut-v${{ github.ref_name }}.zip DockShortcut
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockShortcut-v${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
