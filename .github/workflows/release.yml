name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (Universal)
        run: |
          xcodebuild -project DockShortcut.xcodeproj \
            -scheme DockShortcut \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App
        run: |
          mkdir -p dist
          cp -r build/Build/Products/Release/DockShortcut.app dist/
          cd dist
          zip -r ../DockShortcut-v${{ github.ref_name }}.zip DockShortcut.app
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockShortcut-v${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    name: Update Homebrew Cask
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: huswim/homebrew-tools
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Compute sha256 and update cask
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_BARE="${VERSION#v}"
          URL="https://github.com/huswim/mac-dock-shortcut/releases/download/${VERSION}/DockShortcut-v${VERSION}.zip"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')

          sed -i "s|version \".*\"|version \"${VERSION_BARE}\"|" Casks/dock-shortcut.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Casks/dock-shortcut.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" Casks/dock-shortcut.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dock-shortcut.rb
          git commit -m "Bump dock-shortcut to ${{ github.ref_name }}"
          git push
