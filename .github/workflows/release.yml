name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (Universal)
        run: |
          xcodebuild -project DockShortcut.xcodeproj \
            -scheme DockShortcut \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App
        run: |
          mkdir -p dist
          cp -r build/Build/Products/Release/DockShortcut.app dist/
          cd dist
          zip -r ../DockShortcut-v${{ github.ref_name }}.zip DockShortcut.app
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockShortcut-v${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
